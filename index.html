<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Teachers' Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --gold: #e8c872; --ink: #f6f1e8; --muted: rgba(246, 241, 232, 0.62); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05050d; }
    body { font-family: Inter, system-ui, sans-serif; color: var(--ink); user-select: none; }
    #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .vignette {
      pointer-events: none; position: fixed; inset: 0; z-index: 2;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.55) 100%),
        linear-gradient(180deg, rgba(5, 8, 22, 0.28), transparent 18%, transparent 78%, rgba(5, 8, 22, 0.45));
    }
    .grain {
      pointer-events: none; position: fixed; inset: 0; z-index: 3; opacity: 0.07; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .hud { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
    .topbar, .hint, .pip, .loader, .btn { pointer-events: auto; }
    .topbar { position: absolute; top: 28px; left: 32px; right: 220px; }
    .brand { letter-spacing: 0.28em; font-size: 11px; text-transform: uppercase; color: var(--gold); text-shadow: 0 0 18px rgba(232, 200, 114, 0.45); }
    .brand b {
      display: block; margin-top: 7px; font-family: "Cormorant Garamond", serif; font-size: 28px; font-weight: 600;
      letter-spacing: 0.04em; color: var(--ink); text-shadow: 0 0 24px rgba(255, 240, 210, 0.25);
    }
    .status { text-align: left; font-size: 12px; color: var(--muted); line-height: 1.7; margin-top: 14px; }
    .status strong { color: var(--gold); font-weight: 600; }
    .hint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); text-align: center; min-width: min(92vw, 560px); }
    .hint p { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .pill {
      display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px;
      border: 1px solid rgba(232, 200, 114, 0.28); background: rgba(8, 10, 22, 0.55);
      backdrop-filter: blur(12px); border-radius: 999px; color: var(--ink); font-size: 13px; letter-spacing: 0.04em;
      box-shadow: 0 0 40px rgba(80, 120, 255, 0.12);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #7c8cff; box-shadow: 0 0 10px #9aa6ff; }
    .dot.open { background: #7dffb0; box-shadow: 0 0 10px #7dffb0; }
    .pip {
      position: absolute; top: 28px; right: 32px; width: 168px; border-radius: 16px; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12); background: #090b16;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45), 0 0 24px rgba(120, 150, 255, 0.15);
    }
    .pip video, .pip canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .pip .frame { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #0b0d18; }
    .pip .cap { position: relative; padding: 7px 10px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); background: rgba(8, 10, 18, 0.85); }
    .loader {
      position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #14172a 0%, #05050d 70%);
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    .loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader h1 { font-family: "Cormorant Garamond", serif; font-size: 42px; font-weight: 600; margin-bottom: 12px; }
    .loader p { color: var(--muted); font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; }
    .btn {
      margin-top: 22px; border: 0; cursor: pointer; padding: 12px 22px; border-radius: 999px;
      background: linear-gradient(180deg, #f3e0a6, #d7b45a); color: #2a210c; font-weight: 600; letter-spacing: 0.04em;
      box-shadow: 0 0 28px rgba(232, 200, 114, 0.35);
    }
    .btn.ghost { background: transparent; color: var(--ink); border: 1px solid rgba(255,255,255,0.18); box-shadow: none; margin-left: 8px; }
    video#cam {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 640px;
      height: 480px;
      opacity: 0;
      pointer-events: none;
    }
    @media (max-width: 720px) { .pip { display: none; } .brand b { font-size: 22px; } .topbar { left: 16px; right: 16px; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <video id="cam" playsinline muted></video>
  <div class="hud">
    <div class="topbar">
      <div class="brand">A classroom among the stars<b>Teachers' Day</b></div>
      <div class="status" id="statusLine">Camera idle<br /><strong id="handState">Closed card</strong></div>
    </div>
    <div class="pip" id="pip">
      <div class="frame">
        <video id="pipVideo" playsinline muted></video>
        <canvas id="pipCanvas"></canvas>
      </div>
      <div class="cap" id="pipCap">Hand tracking off</div>
    </div>
    <div class="hint">
      <div class="pill"><span class="dot" id="liveDot"></span><span id="hintText">Show an open palm to open the card</span></div>
      <p>Close your hand to fold it shut · Drag to rotate · Space to toggle</p>
    </div>
  </div>
  <div class="loader" id="loader">
    <h1>Happy Teachers' Day</h1>
    <p id="loadMsg">Lighting the classroom</p>
    <div>
      <button class="btn" id="startCam">Enable Camera</button>
      <button class="btn ghost" id="skipCam">Enter without camera</button>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById("canvas");
      const loaderEl = document.getElementById("loader");
      const loadMsg = document.getElementById("loadMsg");
      const hintText = document.getElementById("hintText");
      const statusLine = document.getElementById("statusLine");
      const liveDot = document.getElementById("liveDot");
      const pipCap = document.getElementById("pipCap");
      const camEl = document.getElementById("cam");
      const pipVideo = document.getElementById("pipVideo");
      const pipCanvas = document.getElementById("pipCanvas");
      const pipCtx = pipCanvas.getContext("2d");

      const CARD_W = 2.18, CARD_H = 2.9, CARD_T = 0.03;
      const CARD_Y = CARD_H * 0.5 + 0.1;
      const state = {
        open: 0, targetOpen: 0, rotY: 0.18, rotX: -0.08,
        targetRotY: 0.18, targetRotX: -0.08, dragging: false, dragMoved: false,
        lastX: 0, lastY: 0, burstDone: false, clock: new THREE.Clock(), handOpenness: 0,
        ignoreClickUntil: 0
      };
      const fx = { hearts: [], ribbons: [] };

      const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.82;
      renderer.shadowMap.enabled = true;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050510);
      scene.fog = new THREE.FogExp2(0x070814, 0.018);

      const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(0, 1.85, 8.6);

      const world = new THREE.Group();
      scene.add(world);
      const cardPivot = new THREE.Group();
      cardPivot.position.set(0, CARD_Y, 0);
      world.add(cardPivot);

      const composer = new THREE.EffectComposer(renderer);
      const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.42, 0.48, 0.72);

      function setHandLabel(text) {
        const el = document.getElementById("handState");
        if (el) el.textContent = text;
      }

      function makePaperTexture(w, h, tint) {
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const g = c.getContext("2d");
        g.fillStyle = tint;
        g.fillRect(0, 0, w, h);
        const img = g.getImageData(0, 0, w, h);
        for (let i = 0; i < img.data.length; i += 4) {
          const n = (Math.random() - 0.5) * 22;
          img.data[i] = Math.max(0, Math.min(255, img.data[i] + n));
          img.data[i + 1] = Math.max(0, Math.min(255, img.data[i + 1] + n * 0.9));
          img.data[i + 2] = Math.max(0, Math.min(255, img.data[i + 2] + n * 0.7));
        }
        g.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function heartPath(g, x, y, s) {
        g.save();
        g.translate(x, y);
        g.scale(s, s);
        g.beginPath();
        g.moveTo(0, 20);
        g.bezierCurveTo(0, -20, -80, -20, -80, 20);
        g.bezierCurveTo(-80, 60, 0, 100, 0, 140);
        g.bezierCurveTo(0, 100, 80, 60, 80, 20);
        g.bezierCurveTo(80, -20, 0, -20, 0, 20);
        g.fill();
        g.restore();
      }

      function makeInsideTexture() {
        const w = 1536, h = 2048;
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const g = c.getContext("2d");
        g.fillStyle = "#f7edd8";
        g.fillRect(0, 0, w, h);
        const img = g.getImageData(0, 0, w, h);
        for (let i = 0; i < img.data.length; i += 4) {
          const n = (Math.random() - 0.5) * 18;
          img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n * 0.8;
        }
        g.putImageData(img, 0, 0);
        const vg = g.createRadialGradient(w * 0.5, h * 0.45, 200, w * 0.5, h * 0.5, w * 0.72);
        vg.addColorStop(0, "rgba(255,248,230,0)");
        vg.addColorStop(1, "rgba(176,140,90,0.18)");
        g.fillStyle = vg;
        g.fillRect(0, 0, w, h);
        g.strokeStyle = "rgba(176, 132, 58, 0.55)";
        g.lineWidth = 8;
        g.strokeRect(72, 72, w - 144, h - 144);
        g.lineWidth = 2;
        g.strokeRect(92, 92, w - 184, h - 184);
        g.fillStyle = "#c4a15a";
        heartPath(g, w * 0.5, 250, 0.55);
        g.textAlign = "center";
        g.fillStyle = "#6b4a1e";
        g.font = "italic 54px 'Cormorant Garamond', serif";
        g.fillText("With gratitude", w / 2, 390);
        g.fillStyle = "#2c2112";
        g.font = "700 118px 'Cormorant Garamond', serif";
        g.fillText("Happy", w / 2, 560);
        g.fillStyle = "#b8892f";
        g.font = "700 108px 'Cormorant Garamond', serif";
        g.fillText("Teachers' Day!", w / 2, 690);
        g.strokeStyle = "rgba(184, 137, 47, 0.7)";
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(430, 760); g.lineTo(1106, 760); g.stroke();
        const lines = [
          "Thank you for writing light upon the blackboard,",
          "and for turning quiet formulas into wonder.",
          "",
          "Your patience is a lantern in the classroom.",
          "Your wisdom is a constellation we still follow.",
          "May every lesson you give return to you as joy.",
          "",
          "With deepest respect,",
          "Your Students"
        ];
        g.fillStyle = "#3d2c16";
        g.font = "italic 46px 'Cormorant Garamond', serif";
        let y = 880;
        for (let i = 0; i < lines.length; i++) { g.fillText(lines[i], w / 2, y); y += 70; }
        g.fillStyle = "rgba(184, 137, 47, 0.9)";
        g.font = "32px Inter, sans-serif";
        g.fillText("SEPTEMBER 10", w / 2, h - 160);
        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function makeFlapTexture() {
        const w = 1024, h = 1365;
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const g = c.getContext("2d");
        g.fillStyle = "#f4e6c8";
        g.fillRect(0, 0, w, h);
        const img = g.getImageData(0, 0, w, h);
        for (let i = 0; i < img.data.length; i += 4) {
          const n = (Math.random() - 0.5) * 16;
          img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
        }
        g.putImageData(img, 0, 0);
        g.textAlign = "center";
        g.fillStyle = "#2d2114";
        g.font = "italic 56px 'Cormorant Garamond', serif";
        g.fillText("A chalkboard full of stars", w / 2, 420);
        g.fillStyle = "#7a5a28";
        g.font = "italic 42px 'Cormorant Garamond', serif";
        ["Because of you,", "knowledge feels like kindness,", "and calculus feels like courage."].forEach(function (t, i) {
          g.fillText(t, w / 2, 560 + i * 70);
        });
        g.fillStyle = "#c4a15a";
        heartPath(g, w * 0.5, 860, 0.42);
        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function panelMaterials(frontMap, backMap) {
        const edgeMat = new THREE.MeshStandardMaterial({ color: 0xead8b0, roughness: 0.82, metalness: 0.04 });
        const front = new THREE.MeshStandardMaterial({ map: frontMap, roughness: 0.9, metalness: 0.0, color: 0xffffff });
        const back = new THREE.MeshStandardMaterial({ map: backMap, roughness: 0.9, metalness: 0.0, color: 0xffffff });
        return [edgeMat, edgeMat, edgeMat, edgeMat, front, back];
      }

      function makeGlowSprite() {
        const c = document.createElement("canvas");
        c.width = 128; c.height = 128;
        const g = c.getContext("2d");
        const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        grd.addColorStop(0, "rgba(255,255,255,1)");
        grd.addColorStop(0.35, "rgba(255,230,180,0.45)");
        grd.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = grd;
        g.fillRect(0, 0, 128, 128);
        return new THREE.CanvasTexture(c);
      }

      function addStars() {
        const count = 900;
        const pos = new Float32Array(count * 3);
        const col = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          const r = 18 + Math.random() * 70;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          pos[i * 3 + 1] = r * Math.cos(phi) * 0.65 + 8;
          pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
          const c = new THREE.Color().setHSL(0.55 + Math.random() * 0.2, 0.35, 0.72 + Math.random() * 0.25);
          col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
        scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
          size: 0.12, vertexColors: true, transparent: true, opacity: 0.9,
          blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
        })));
        const glowTex = makeGlowSprite();
        for (let i = 0; i < 12; i++) {
          const spr = new THREE.Sprite(new THREE.SpriteMaterial({
            map: glowTex, color: i % 3 === 0 ? 0x9ecbff : 0xffe2a8,
            blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
            opacity: 0.16 + Math.random() * 0.18
          }));
          spr.scale.setScalar(1.2 + Math.random() * 3.4);
          spr.position.set((Math.random() - 0.5) * 40, 4 + Math.random() * 18, -8 - Math.random() * 28);
          scene.add(spr);
        }
      }

      const nebulaMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: { uTime: { value: 0 } },
        vertexShader: "varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
        fragmentShader: [
          "varying vec3 vPos; uniform float uTime;",
          "void main(){",
          "  vec3 n = normalize(vPos);",
          "  float h = n.y * 0.5 + 0.5;",
          "  vec3 deep = vec3(0.02, 0.03, 0.08);",
          "  vec3 mid = vec3(0.08, 0.07, 0.18);",
          "  vec3 gold = vec3(0.18, 0.12, 0.08);",
          "  vec3 col = mix(deep, mid, smoothstep(0.15, 0.7, h));",
          "  col = mix(col, gold, smoothstep(0.55, 1.0, h) * 0.35);",
          "  float band = 0.08 * sin(n.x * 6.0 + uTime * 0.05) * sin(n.z * 5.0);",
          "  col += vec3(0.04, 0.05, 0.12) * band;",
          "  gl_FragColor = vec4(col, 1.0);",
          "}"
        ].join("\n")
      });

      function woodMat(color) {
        return new THREE.MeshStandardMaterial({ map: makePaperTexture(256, 256, color), roughness: 0.72, metalness: 0.05 });
      }

      function addClassroom() {
        const desk = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.16, 3.2), woodMat("#6b4630"));
        desk.position.set(0, -0.08, 0.15);
        desk.castShadow = true; desk.receiveShadow = true;
        world.add(desk);
        const lip = new THREE.Mesh(new THREE.BoxGeometry(6.5, 0.08, 0.14), woodMat("#593820"));
        lip.position.set(0, 0.02, 1.72);
        world.add(lip);
        const colors = [0x7a2e2e, 0x2e4a73, 0x3d5c3a, 0x8a5a24];
        for (let i = 0; i < 4; i++) {
          const b = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.08 + i * 0.02, 0.9), new THREE.MeshStandardMaterial({ color: colors[i], roughness: 0.7 }));
          b.position.set(-2.35, 0.08 + i * 0.09, 0.7);
          b.rotation.y = 0.18;
          b.castShadow = true;
          world.add(b);
        }
        const apple = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 16), new THREE.MeshStandardMaterial({ color: 0xb42a2a, roughness: 0.35, metalness: 0.1 }));
        apple.position.set(2.15, 0.18, 0.85);
        apple.scale.y = 0.9;
        world.add(apple);
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.016, 0.08, 8), new THREE.MeshStandardMaterial({ color: 0x3a2412 }));
        stem.position.set(2.15, 0.3, 0.85);
        world.add(stem);
        const globe = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 16), new THREE.MeshStandardMaterial({ color: 0x3e6b8a, roughness: 0.45, metalness: 0.2, emissive: 0x102030, emissiveIntensity: 0.2 }));
        globe.position.set(2.28, 0.42, -0.15);
        world.add(globe);
        const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.12, 0.1, 12), woodMat("#4a321f"));
        stand.position.set(2.28, 0.16, -0.15);
        world.add(stand);
        const chalk = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.22, 10), new THREE.MeshStandardMaterial({ color: 0xf2f0e6, roughness: 0.9 }));
        chalk.rotation.z = Math.PI / 2;
        chalk.position.set(-1.55, 0.06, 1.05);
        world.add(chalk);
        const lampPole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 1.1, 12), new THREE.MeshStandardMaterial({ color: 0xcfc6b8, metalness: 0.7, roughness: 0.25 }));
        lampPole.position.set(-2.55, 0.62, -0.55);
        world.add(lampPole);
        const shade = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.22, 20, 1, true), new THREE.MeshStandardMaterial({ color: 0xc9b48a, emissive: 0x8a6a32, emissiveIntensity: 0.22, side: THREE.DoubleSide }));
        shade.position.set(-2.35, 1.18, -0.2);
        shade.rotation.z = 0.6;
        world.add(shade);
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffe7b0, emissive: 0xffd27a, emissiveIntensity: 0.85 }));
        bulb.position.set(-2.28, 1.08, -0.12);
        world.add(bulb);
        const lampLight = new THREE.PointLight(0xffd9a0, 1.35, 6.2, 1.8);
        lampLight.position.copy(bulb.position);
        world.add(lampLight);
      }

      function addLights() {
        scene.add(new THREE.AmbientLight(0x9aa3c8, 0.42));
        const key = new THREE.DirectionalLight(0xffe6c2, 0.72);
        key.position.set(-5, 8, 6);
        key.castShadow = true;
        scene.add(key);
        const rim = new THREE.DirectionalLight(0x8fb0ff, 0.38);
        rim.position.set(6, 3, -5);
        scene.add(rim);
        const fill = new THREE.PointLight(0x7aa0ff, 0.55, 20, 2);
        fill.position.set(0, 4.5, 5);
        scene.add(fill);
        const gold = new THREE.SpotLight(0xfff0cc, 0.55, 18, 0.32, 0.55, 1.1);
        gold.position.set(0, 7.2, 4.2);
        gold.target.position.set(0, 0.6, 0);
        scene.add(gold);
        scene.add(gold.target);
      }

      function heartShape() {
        const s = new THREE.Shape();
        s.moveTo(0, 0.35);
        s.bezierCurveTo(0, 0.55, -0.28, 0.72, -0.5, 0.42);
        s.bezierCurveTo(-0.78, 0.05, -0.2, -0.18, 0, -0.52);
        s.bezierCurveTo(0.2, -0.18, 0.78, 0.05, 0.5, 0.42);
        s.bezierCurveTo(0.28, 0.72, 0, 0.55, 0, 0.35);
        return s;
      }

      function spawnCelebration() {
        const origin = new THREE.Vector3(0, 0.85, 0.15);
        cardPivot.localToWorld(origin);
        const palette = [0xff5b7c, 0xffc14d, 0x7ad7ff, 0xff7ad9, 0x8bffb0, 0xff8a5b, 0xd4a5ff];
        const heartGeo = new THREE.ExtrudeGeometry(heartShape(), { depth: 0.05, bevelEnabled: false });
        heartGeo.center();
        for (let i = 0; i < 28; i++) {
          const mat = new THREE.MeshStandardMaterial({
            color: palette[i % palette.length], emissive: palette[i % palette.length],
            emissiveIntensity: 0.45, roughness: 0.4, metalness: 0.15, transparent: true
          });
          const mesh = new THREE.Mesh(heartGeo, mat);
          mesh.scale.setScalar(0.18 + Math.random() * 0.16);
          mesh.position.copy(origin);
          scene.add(mesh);
          fx.hearts.push({
            mesh: mesh,
            vel: new THREE.Vector3((Math.random() - 0.5) * 3.4, 2.2 + Math.random() * 3.2, 0.6 + Math.random() * 2.4),
            spin: new THREE.Vector3(Math.random() * 4, Math.random() * 6, Math.random() * 4),
            life: 1, age: 0
          });
        }
        for (let i = 0; i < 36; i++) {
          const geo = new THREE.PlaneGeometry(0.06 + Math.random() * 0.05, 0.42 + Math.random() * 0.35);
          const mat = new THREE.MeshStandardMaterial({
            color: palette[i % palette.length], emissive: palette[i % palette.length],
            emissiveIntensity: 0.35, side: THREE.DoubleSide, roughness: 0.45, transparent: true
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.copy(origin);
          scene.add(mesh);
          fx.ribbons.push({
            mesh: mesh,
            vel: new THREE.Vector3((Math.random() - 0.5) * 2.8, 1.6 + Math.random() * 2.8, 0.4 + Math.random() * 2.1),
            spin: new THREE.Vector3((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 8),
            life: 1, age: 0, wave: Math.random() * Math.PI * 2
          });
        }
      }

      function updateFX(dt) {
        const lists = [fx.hearts, fx.ribbons];
        for (let L = 0; L < lists.length; L++) {
          const list = lists[L];
          for (let i = list.length - 1; i >= 0; i--) {
            const p = list[i];
            p.age += dt;
            p.life -= dt * 0.28;
            p.vel.y += -2.6 * dt;
            p.vel.multiplyScalar(0.992);
            p.mesh.position.addScaledVector(p.vel, dt);
            p.mesh.rotation.x += p.spin.x * dt;
            p.mesh.rotation.y += p.spin.y * dt;
            p.mesh.rotation.z += p.spin.z * dt;
            if (p.wave != null) p.mesh.position.x += Math.sin(p.age * 6 + p.wave) * dt * 0.35;
            p.mesh.material.opacity = Math.max(0, p.life);
            if (p.life <= 0) { scene.remove(p.mesh); list.splice(i, 1); }
          }
        }
      }

      function dist3(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y, (a.z || 0) - (b.z || 0));
      }

      function palmOpenness(lm) {
        const wrist = lm[0];
        const fingers = [[8, 6, 5], [12, 10, 9], [16, 14, 13], [20, 18, 17]];
        let ext = 0;
        for (let i = 0; i < fingers.length; i++) {
          const tip = fingers[i][0], pip = fingers[i][1], mcp = fingers[i][2];
          const stretched = dist3(lm[tip], wrist) > dist3(lm[pip], wrist) * 1.05;
          const straight = dist3(lm[tip], lm[mcp]) > dist3(lm[pip], lm[mcp]) * 1.15;
          if (stretched || straight) ext += 1;
        }
        const thumbOpen = dist3(lm[4], lm[8]) > 0.12 && dist3(lm[4], lm[17]) > dist3(lm[2], lm[17]);
        if (thumbOpen) ext += 0.8;
        return Math.min(1, ext / 4.8);
      }

      function drawHands(landmarks) {
        const w = pipCanvas.width = pipVideo.videoWidth || 320;
        const h = pipCanvas.height = pipVideo.videoHeight || 240;
        pipCtx.clearRect(0, 0, w, h);
        if (!landmarks) return;
        pipCtx.strokeStyle = "rgba(232, 200, 114, 0.9)";
        pipCtx.fillStyle = "rgba(255, 255, 255, 0.92)";
        pipCtx.lineWidth = 2;
        const pairs = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
        for (let i = 0; i < pairs.length; i++) {
          const a = landmarks[pairs[i][0]], b = landmarks[pairs[i][1]];
          pipCtx.beginPath();
          pipCtx.moveTo(a.x * w, a.y * h);
          pipCtx.lineTo(b.x * w, b.y * h);
          pipCtx.stroke();
        }
        for (let i = 0; i < landmarks.length; i++) {
          pipCtx.beginPath();
          pipCtx.arc(landmarks[i].x * w, landmarks[i].y * h, 3, 0, Math.PI * 2);
          pipCtx.fill();
        }
      }

      let hands = null;
      let detecting = false;
      let openFrames = 0, closeFrames = 0;
      const HANDS_CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/";

      function onHandResults(results) {
        const lm = results.multiHandLandmarks && results.multiHandLandmarks[0];
        drawHands(lm);
        if (!lm) {
          setHandLabel("No hand in view");
          return;
        }
        const openness = palmOpenness(lm);
        state.handOpenness = THREE.MathUtils.lerp(state.handOpenness, openness, 0.4);
        if (openness > 0.52) { openFrames++; closeFrames = 0; }
        else if (openness < 0.30) { closeFrames++; openFrames = 0; }
        if (openFrames > 2) state.targetOpen = 1;
        if (closeFrames > 2) state.targetOpen = 0;
        const open = state.targetOpen > 0.5;
        liveDot.classList.toggle("open", open);
        setHandLabel(open ? "Open palm — card opening" : "Hand " + Math.round(openness * 100) + "% open");
        hintText.textContent = open ? "Close your hand to fold the card" : "Show an open palm to open the card";
        pipCap.textContent = open ? "Palm open" : "Palm closing";
      }

      function setupHands() {
        return new Promise(function (resolve, reject) {
          loadMsg.textContent = "Loading hand tracking";
          if (typeof Hands === "undefined") {
            reject(new Error("MediaPipe Hands failed to load"));
            return;
          }
          hands = new Hands({
            locateFile: function (file) { return HANDS_CDN + file; }
          });
          hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
          });
          hands.onResults(onHandResults);
          const ready = hands.initialize ? hands.initialize() : Promise.resolve();
          ready.then(function () {
            return navigator.mediaDevices.getUserMedia({
              video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
              audio: false
            });
          }).then(function (stream) {
            camEl.srcObject = stream;
            pipVideo.srcObject = stream;
            camEl.setAttribute("width", "640");
            camEl.setAttribute("height", "480");
            pipVideo.setAttribute("width", "640");
            pipVideo.setAttribute("height", "480");
            return Promise.all([camEl.play(), pipVideo.play()]);
          }).then(function () {
            statusLine.innerHTML = 'Camera ready<br /><strong id="handState">Looking for a hand</strong>';
            pipCap.textContent = "Single-hand tracking";
            resolve();
          }).catch(reject);
        });
      }

      function detectHands() {
        const video = (pipVideo.readyState >= 2) ? pipVideo : camEl;
        if (!hands || detecting || video.readyState < 2 || !video.videoWidth) return;
        detecting = true;
        const job = hands.send({ image: video });
        if (job && typeof job.then === "function") {
          job.catch(function () {}).then(function () { detecting = false; });
        } else {
          detecting = false;
        }
      }

      function fallbackCover() {
        const c = document.createElement("canvas");
        c.width = 768; c.height = 1024;
        const g = c.getContext("2d");
        g.fillStyle = "#f7f3ea";
        g.fillRect(0, 0, 768, 1024);
        g.fillStyle = "#111";
        g.fillRect(90, 80, 420, 300);
        g.strokeStyle = "#c9a36b";
        g.lineWidth = 14;
        g.strokeRect(90, 80, 420, 300);
        g.fillStyle = "#222";
        g.font = "italic 42px serif";
        g.fillText("Happy Teacher's Day", 280, 520);
        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function loadCover(done) {
        const loader = new THREE.TextureLoader();
        loader.load("assets/cover.png", function (tex) {
          tex.encoding = THREE.sRGBEncoding;
          done(tex);
        }, undefined, function () { done(fallbackCover()); });
      }

      function buildCard(coverTex) {
        const insideTex = makeInsideTexture();
        const flapTex = makeFlapTexture();
        const backOuter = makePaperTexture(512, 512, "#d9c49a");
        const frontPanel = new THREE.Mesh(new THREE.BoxGeometry(CARD_W, CARD_H, CARD_T), panelMaterials(coverTex, flapTex));
        const backPanel = new THREE.Mesh(new THREE.BoxGeometry(CARD_W, CARD_H, CARD_T), panelMaterials(insideTex, backOuter));
        frontPanel.castShadow = true;
        backPanel.castShadow = true;
        const hinge = new THREE.Group();
        hinge.position.set(0, CARD_H / 2, CARD_T * 1.2);
        const frontHolder = new THREE.Group();
        frontHolder.position.set(0, -CARD_H / 2, 0);
        frontHolder.add(frontPanel);
        hinge.add(frontHolder);
        const cardRoot = new THREE.Group();
        backPanel.position.z = -CARD_T * 0.8;
        cardRoot.add(backPanel);
        cardRoot.add(hinge);
        cardPivot.add(cardRoot);
        const seamGlow = new THREE.PointLight(0xff9ec8, 0, 3.2, 2);
        seamGlow.position.set(0, 0.1, 0.2);
        cardRoot.add(seamGlow);
        return { hinge: hinge, seamGlow: seamGlow };
      }

      scene.add(new THREE.Mesh(new THREE.SphereGeometry(90, 32, 32), nebulaMat));
      addStars();
      addLights();
      addClassroom();

      composer.addPass(new THREE.RenderPass(scene, camera));
      composer.addPass(bloom);

      function resize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener("resize", resize);

      canvas.addEventListener("pointerdown", function (e) {
        state.dragging = true;
        state.dragMoved = false;
        state.lastX = e.clientX;
        state.lastY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener("pointermove", function (e) {
        if (!state.dragging) return;
        const dx = e.clientX - state.lastX, dy = e.clientY - state.lastY;
        if (Math.hypot(dx, dy) > 3) state.dragMoved = true;
        state.targetRotY += dx * 0.007;
        state.targetRotX = THREE.MathUtils.clamp(state.targetRotX + dy * 0.005, -0.55, 0.4);
        state.lastX = e.clientX;
        state.lastY = e.clientY;
      });
      canvas.addEventListener("pointerup", function (e) {
        if (!state.dragMoved && e.button === 0 && performance.now() > state.ignoreClickUntil) {
          state.targetOpen = state.targetOpen > 0.5 ? 0 : 1;
        }
        state.dragging = false;
      });
      window.addEventListener("keydown", function (e) {
        if (e.code === "Space") {
          e.preventDefault();
          state.targetOpen = state.targetOpen > 0.5 ? 0 : 1;
        }
      });

      function easeInOut(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }

      let hinge = null, seamGlow = null;

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(0.033, state.clock.getDelta());
        const t = state.clock.elapsedTime;
        detectHands();
        nebulaMat.uniforms.uTime.value = t;
        state.open += (state.targetOpen - state.open) * (1 - Math.exp(-dt * 3.4));
        state.rotY += (state.targetRotY - state.rotY) * (1 - Math.exp(-dt * 7));
        state.rotX += (state.targetRotX - state.rotX) * (1 - Math.exp(-dt * 7));
        if (!state.dragging) state.targetRotY += Math.sin(t * 0.35) * 0.0008;
        const e = easeInOut(state.open);
        if (hinge) hinge.rotation.x = THREE.MathUtils.lerp(0.0, -Math.PI * 0.92, e);
        cardPivot.rotation.set(state.rotX, state.rotY, 0);
        cardPivot.position.y = CARD_Y + e * 0.05;
        if (seamGlow) seamGlow.intensity = e > 0.12 && e < 0.85 ? 2.8 * Math.sin(e * Math.PI) : 0;
        if (state.open > 0.38 && state.targetOpen > 0.5 && !state.burstDone) {
          state.burstDone = true;
          spawnCelebration();
        }
        if (state.open < 0.12 && state.targetOpen < 0.5) state.burstDone = false;
        updateFX(dt);
        camera.position.x = Math.sin(t * 0.12) * 0.12;
        camera.lookAt(0, 1.35, 0);
        composer.render();
      }

      loadCover(function (coverTex) {
        const built = buildCard(coverTex);
        hinge = built.hinge;
        seamGlow = built.seamGlow;
        loadMsg.textContent = "Ready";
        animate();
      });

      document.getElementById("startCam").addEventListener("click", function () {
        setupHands().then(function () {
          state.ignoreClickUntil = performance.now() + 600;
          loaderEl.classList.add("hide");
        }).catch(function (err) {
          loadMsg.textContent = "Camera unavailable — you can still drag and press Space";
          statusLine.innerHTML = 'Camera blocked<br /><strong id="handState">Use Space or click</strong>';
          console.error(err);
        });
      });
      document.getElementById("skipCam").addEventListener("click", function () {
        state.ignoreClickUntil = performance.now() + 600;
        loaderEl.classList.add("hide");
        hintText.textContent = "Click the card or press Space to open";
        statusLine.innerHTML = 'Camera skipped<br /><strong id="handState">Manual control</strong>';
      });
    })();
  </script>
</body>
</html>
